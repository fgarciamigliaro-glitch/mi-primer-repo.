<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLife App</title>
</head>
<body>

    <h1>FitLife App</h1>
    <p>Registro de usuarios y soporte técnico</p>

    <!-- FORMULARIO DE REGISTRO -->
    <section>
        <h2>Registro de Usuario</h2>

        <form action="https://formspree.io/f/xpqewvwa" method="POST">

            <fieldset>
                <legend>Información Personal</legend>

                <label for="nombre">Nombre completo:</label><br>
                <input type="text"
                       id="nombre"
                       name="nombre"
                       placeholder="Ingrese su nombre completo"
                       autocomplete="name"
                       minlength="3"
                       maxlength="60"
                       required>
                <br><br>

                <label for="email">Correo electrónico:</label><br>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="correo@ejemplo.com"
                       autocomplete="email"
                       required>
                <br><br>

                <label for="password">Contraseña:</label><br>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Mínimo 8 caracteres"
                       autocomplete="new-password"
                       minlength="8"
                       required>
                <br><br>

                <label for="edad">Edad:</label><br>
                <input type="number"
                       id="edad"
                       name="edad"
                       min="13"
                       max="100"
                       required>
                <br><br>

                <label for="fechaNacimiento">Fecha de nacimiento:</label><br>
                <input type="date"
                       id="fechaNacimiento"
                       name="fechaNacimiento"
                       required>

            </fieldset>

            <br>

            <fieldset>
                <legend>Cuenta de Usuario</legend>

                <label for="usuario">Nombre de usuario:</label><br>
                <input type="text"
                       id="usuario"
                       name="usuario"
                       placeholder="5 a 12 caracteres"
                       minlength="5"
                       maxlength="12"
                       pattern="[A-Za-z0-9]{5,12}"
                       required
                       aria-label="Nombre de usuario">
            </fieldset>

            <br>

            <fieldset>
                <legend>Ubicación</legend>

                <label for="pais">País:</label><br>
                <select id="pais" name="pais" required>
                    <option value="">Seleccione un país</option>
                    <option>Argentina</option>
                    <option>Chile</option>
                    <option>Uruguay</option>
                    <option>México</option>
                    <option>España</option>
                </select>

                <br><br>

                <label for="ciudad">Ciudad:</label><br>
                <input type="text"
                       id="ciudad"
                       name="ciudad"
                       list="listaCiudades"
                       placeholder="Escriba una ciudad"
                       required>

                <datalist id="listaCiudades">
                    <option value="Buenos Aires">
                    <option value="Córdoba">
                    <option value="Rosario">
                    <option value="Montevideo">
                    <option value="Madrid">
                    <option value="Santiago">
                </datalist>

            </fieldset>

            <br>

            <fieldset>
                <legend>Perfil</legend>

                <p>Género:</p>

                <input type="radio" id="masculino" name="genero" value="Masculino" required>
                <label for="masculino">Masculino</label>

                <input type="radio" id="femenino" name="genero" value="Femenino">
                <label for="femenino">Femenino</label>

                <input type="radio" id="otro" name="genero" value="Otro">
                <label for="otro">Otro</label>

                <br><br>

                <p>Intereses:</p>

                <input type="checkbox" id="fitness" name="intereses" value="Fitness">
                <label for="fitness">Fitness</label>

                <input type="checkbox" id="nutricion" name="intereses" value="Nutrición">
                <label for="nutricion">Nutrición</label>

                <input type="checkbox" id="running" name="intereses" value="Running">
                <label for="running">Running</label>

                <input type="checkbox" id="yoga" name="intereses" value="Yoga">
                <label for="yoga">Yoga</label>

                <br><br>

                <label for="biografia">Biografía corta:</label><br>
                <textarea id="biografia"
                          name="biografia"
                          rows="5"
                          cols="40"
                          maxlength="300"
                          placeholder="Cuéntanos algo sobre ti"></textarea>

            </fieldset>

            <br>

            <button type="submit">Crear Cuenta</button>

        </form>
    </section>

    <hr>

    <!-- FORMULARIO DE CONTACTO -->
    <section>
        <h2>Contacto y Soporte Técnico</h2>

        <form action="https://formspree.io/f/xpqewvwa" method="POST">

            <label for="contactoNombre">Nombre:</label><br>
            <input type="text"
                   id="contactoNombre"
                   name="contactoNombre"
                   autocomplete="name"
                   required>

            <br><br>

            <label for="contactoEmail">Email:</label><br>
            <input type="email"
                   id="contactoEmail"
                   name="contactoEmail"
                   autocomplete="email"
                   required>

            <br><br>

            <label for="motivo">Motivo de contacto:</label><br>
            <select id="motivo" name="motivo" required>
                <option value="">Seleccione una opción</option>
                <option>Problema técnico</option>
                <option>Consulta</option>
                <option>Sugerencia</option>
                <option>Facturación</option>
            </select>

            <br><br>

            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje"
                      name="mensaje"
                      rows="6"
                      cols="50"
                      required></textarea>

            <br><br>

            <input type="checkbox"
                   id="terminos"
                   name="terminos"
                   required>

            <label for="terminos">
                Acepto los términos y condiciones
            </label>

            <br><br>

            <button type="submit">Enviar Consulta</button>

        </form>
    </section>

</body>
</html>
